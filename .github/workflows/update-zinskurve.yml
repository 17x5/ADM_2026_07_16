name: Zinskurve aktualisieren

on:
  schedule:
    - cron: '0 7 * * 1-5'   # 1x täglich, Mo-Fr, 07:00 UTC (FRED aktualisiert mit ca. 1 Tag Verzug)
  workflow_dispatch:          # manueller Start im Actions-Tab möglich

permissions:
  contents: write

jobs:
  update-zinskurve:
    runs-on: ubuntu-latest
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Zinskurve (T10Y2Y) von der offiziellen FRED-API holen
        run: |
          curl -s \
            "https://api.stlouisfed.org/fred/series/observations?series_id=T10Y2Y&api_key=${FRED_API_KEY}&file_type=json&sort_order=desc&limit=10" \
            -o raw.json
          cat raw.json

      - name: JSON auswerten
        run: |
          python3 - <<'EOF'
          import json

          with open('raw.json') as f:
              raw = json.load(f)

          obs = raw.get('observations', [])
          # API liefert neueste zuerst (sort_order=desc); "." = kein Wert (Feiertag)
          gueltige = [o for o in obs if o.get('value') not in (None, '.')]

          if len(gueltige) < 1:
              raise RuntimeError("Keine gueltigen T10Y2Y-Werte von der FRED-API erhalten.")

          aktuell = gueltige[0]
          aktuell_wert = float(aktuell['value'])
          aktuell_datum = aktuell['date']

          if len(gueltige) >= 2:
              vortag_wert = float(gueltige[1]['value'])
              aenderung = round(aktuell_wert - vortag_wert, 3)
          else:
              aenderung = 0

          data = {
              "value": aktuell_wert,
              "change": aenderung,
              "date": aktuell_datum
          }

          with open('zinskurve.json', 'w') as out:
              json.dump(data, out)

          print(data)
          EOF

      - name: Änderung committen
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add zinskurve.json
          git diff --quiet --cached || git commit -m "Zinskurve aktualisiert"
          git push
