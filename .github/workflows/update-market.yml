name: Marktdaten aktualisieren

# Ersetzt update-etf, update-gold, update-oil, update-move und update-zinskurve.
# Ein Lauf, ein Commit, ein Pages-Deploy statt fünf.
on:
  schedule:
    - cron: "*/30 7-20 * * 1-5"   # alle 30 Min, 07:00–20:30 UTC
    - cron: "15 21 * * 1-5"       # Schlusswerte US
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-market
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Werte holen
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # optional, sonst CSV-Export
        run: python scripts/update_market.py

      - name: Commit, falls geändert
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          git diff --cached --quiet || git commit -m "Marktdaten aktualisiert"
          git pull --rebase --autostash
          git push
