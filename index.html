<!doctype html>
<html lang="de">
<head>
<!-- ⚙️ VERSION: hier anpassen (Zürcher Zeit) -->
<script>const APP_VERSION = "2026-11-23 | 10:47";</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B0E13">
<link rel="icon" type="image/png" href="favicon.png">
<title>Markt-Cockpit</title>
<style>
/* ════════════════════════════════════════════════════════════
   1. DESIGN-TOKENS
   ════════════════════════════════════════════════════════════ */
:root {
  --bg: #0B0E13;
  --card: #161B22;
  --card-inset: #0F1318;
  --line: #262D36;
  --line-soft: #1F252D;
  --text: #E6E9EE;
  --text-2: #C9CFD6;
  --muted: #9AA3AE;
  --accent: #7DB3FF;
  --green: #3FA34D;
  --yellow: #F2C230;
  --red: #E5533D;
  --red-text: #F08A7A;
  --green-text: #7FCB8A;
  --violet: #D2B4FF;
  --blue: #4F8FE0;
  --neutral: #6B7480;
  --radius: 14px;
  --gap: 10px;
  --font: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

/* ════════════════════════════════════════════════════════════
   2. BASIS
   ════════════════════════════════════════════════════════════ */
* { box-sizing: border-box; }
html, body { overflow-x: hidden; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); -webkit-text-size-adjust: 100%; }
a { color: var(--accent); }
button, input, select { font-family: inherit; }
.app { max-width: 480px; margin: 0 auto; padding: 12px 12px 16px; display: flex; flex-direction: column; gap: var(--gap); }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* ════════════════════════════════════════════════════════════
   3. KOMPONENTEN
   ════════════════════════════════════════════════════════════ */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.card[data-level="green"]  { border: 1.5px solid var(--green); }
.card[data-level="yellow"] { border: 1.5px solid var(--yellow); }
.card[data-level="red"]    { border: 1.5px solid var(--red); }

.status-bar { color: var(--bg); background: var(--neutral); padding: 1px 12px; text-align: center; font-size: 12px; font-weight: 600; line-height: 1.3; position: relative; }
.status-bar[data-level="green"]  { background: var(--green); }
.status-bar[data-level="yellow"] { background: var(--yellow); }
.status-bar[data-level="red"]    { background: var(--red); }
.status-bar a { position: absolute; right: 12px; color: var(--bg); }

.dot { width: 10px; height: 10px; border-radius: 999px; display: inline-block; flex-shrink: 0; background: var(--neutral); }
.dot[data-level="green"]  { background: var(--green); }
.dot[data-level="yellow"] { background: var(--yellow); }
.dot[data-level="red"]    { background: var(--red); }
.dot[data-level="blue"]   { background: var(--blue); }

/* Kopfzeile */
.header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.header h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.2px; white-space: nowrap; }
.info-row { display: flex; align-items: center; gap: 2px; white-space: nowrap; }
.refresh { background: none; border: none; color: var(--accent); width: 40px; height: 40px; margin: -10px -2px -10px -10px; display: flex; align-items: center; justify-content: center; border-radius: 10px; cursor: pointer; }
.refresh:disabled { color: var(--muted); cursor: default; }
.refresh[data-busy="true"] svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.live { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: 12px; color: var(--muted); }
.live__badge { display: flex; align-items: center; gap: 5px; font-weight: 600; }
.live__badge::before { content: ""; width: 8px; height: 8px; border-radius: 999px; background: var(--neutral); }
.live__badge[data-state="live"] { color: var(--green-text); }
.live__badge[data-state="live"]::before { background: var(--green); }
.live__badge[data-state="offline"] { color: var(--red-text); }
.live__badge[data-state="offline"]::before { background: var(--red); }
.live__info[data-stale="true"] { color: var(--yellow); }
.live__row { display: flex; align-items: center; gap: 12px; }
.ai-badge { display: flex; align-items: center; gap: 5px; font-weight: 600; color: var(--muted); }
.ai-badge::before { content: ""; width: 8px; height: 8px; border-radius: 999px; background: var(--neutral); }
.ai-badge[data-state="ok"]::before   { background: var(--green); }
.ai-badge[data-state="busy"]::before { background: var(--yellow); }
.ai-badge[data-state="fail"]::before { background: var(--red); }
.ai-badge[data-state="off"] { opacity: 0.6; }
/* Schieber Gemini ein/aus (Klickfläche 44×28, sichtbar 34×20) */
.switch { position: relative; width: 44px; height: 28px; margin: -4px -6px; background: none; border: none; padding: 0; cursor: pointer; flex-shrink: 0; }
.switch::before { content: ""; position: absolute; left: 5px; top: 4px; width: 34px; height: 20px; border-radius: 999px; background: var(--line); transition: background 0.15s; }
.switch::after { content: ""; position: absolute; left: 8px; top: 7px; width: 14px; height: 14px; border-radius: 999px; background: var(--muted); transition: left 0.15s, background 0.15s; }
.switch[aria-checked="true"]::before { background: var(--green); }
.switch[aria-checked="true"]::after { left: 22px; background: #fff; }
.switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; border-radius: 999px; }

/* Smiley-Reihe */
.signals { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); column-gap: 3px; padding: 6px 3px; }
.signal { background: none; border: none; color: var(--text); display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 2px 0; min-height: 44px; min-width: 0; cursor: pointer; }
/* Name darf nur an &shy; umbrechen (Früh-warner); feste Höhe hält die Zeilen darunter auf einer Linie */
.signal__name { font-size: clamp(10px, 2.7vw, 11.5px); font-weight: 600; line-height: 13px; height: 26px; display: flex; align-items: center; text-align: center; hyphens: manual; }
.signal__src { font-size: clamp(10px, 2.6vw, 11px); color: var(--muted); white-space: nowrap; }
.signal__value { font-size: 15px; font-weight: 700; height: 19px; line-height: 19px; }
.signal__range { font-size: 11px; color: #AEB6C0; height: 14px; line-height: 14px; }
.lights { display: flex; gap: 4px; align-items: center; height: 19px; }

/* Wellen-Zyklus */
.wave { padding: 4px 12px; }
.wave svg { display: block; width: 100%; height: auto; }

/* ETFs */
.etfs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.etf { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.etf__name { display: flex; align-items: center; gap: 3px; font-size: 11px; color: var(--muted); white-space: nowrap; max-width: 100%; overflow: hidden; }
.etf__price { font-size: 15px; font-weight: 700; }
.etf__cur { font-size: 11px; font-weight: 500; color: var(--muted); }
.etf__chg { display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
.etf__chg[data-dir="down"] { color: var(--red-text); }
.etf__chg[data-dir="up"]   { color: var(--green-text); }
.etf__date { font-size: 10px; color: var(--muted); }

/* Tabs */
.tablist { display: grid; grid-template-columns: 0.9fr 1fr 1.1fr 1.25fr 1.1fr 0.85fr;   /* Fazit, Action, Diagnose, Indikatoren, Bollinger, Frage */ border-bottom: 1px solid var(--line); }
.tab { background: none; border: none; min-height: 44px; padding: 0; font-size: clamp(9.5px, 2.45vw, 11.5px); letter-spacing: -0.2px; min-width: 0; color: var(--muted); font-weight: 500; white-space: nowrap; cursor: pointer; }
.tab[aria-selected="true"] { color: var(--text); font-weight: 700; box-shadow: inset 0 -2px 0 var(--accent); }
.panel { padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 10px; }
.panel p { margin: 0; font-size: 14px; line-height: 1.45; }
.panel h3 { margin: 0; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; }
.block { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); padding-top: 8px; }
.loading { color: var(--muted); font-size: 13px; }
.error-text { color: var(--red-text); font-size: 13px; }

.kv { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.kv > :nth-child(2) { flex-grow: 1; }
.kv > :last-child { color: var(--muted); }

.action { display: flex; gap: 10px; }
.action__nr { width: 22px; height: 22px; border-radius: 999px; background: var(--line); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.action__title { font-size: 14px; font-weight: 600; }
.action__text { font-size: 13px; color: #AEB6C0; line-height: 1.4; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; background: var(--card-inset); border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; }
.verdict { font-size: 15px; font-weight: 700; }
.verdict[data-level="green"]  { color: var(--green-text); }
.verdict[data-level="yellow"] { color: var(--yellow); }
.verdict[data-level="red"]    { color: var(--red-text); }
.verdict[data-level="blue"]   { color: #8DB8F0; }

.phase { background: var(--card-inset); border-left: 3px solid var(--neutral); border-radius: 0 8px 8px 0; padding: 8px 10px; }
.phase[data-level="green"]  { border-left-color: var(--green); }
.phase[data-level="yellow"] { border-left-color: var(--yellow); }
.phase[data-level="red"]    { border-left-color: var(--red); }
.phase__name { font-size: 12px; font-weight: 700; letter-spacing: 0.3px; }
.phase__desc { font-size: 13px; color: var(--text-2); line-height: 1.4; margin-top: 2px; }

.row-btn { background: none; border: none; border-bottom: 1px solid var(--line-soft); color: var(--text); display: flex; align-items: center; gap: 10px; padding: 0; min-height: 44px; font-size: 13px; text-align: left; cursor: pointer; width: 100%; }
.row-btn > :nth-child(2) { flex-grow: 1; }
.back-btn { background: none; border: none; color: var(--accent); display: flex; align-items: center; gap: 4px; padding: 0; min-height: 44px; font-size: 13px; cursor: pointer; align-self: flex-start; }
.ind-row { display: grid; grid-template-columns: 10px 1fr auto 12px; gap: 4px 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line-soft); }
.ind-row__name { font-size: 13px; font-weight: 600; }
.ind-row__val { font-size: 13px; font-weight: 600; }
.ind-row__desc { grid-column: 2 / 5; font-size: 12px; color: var(--muted); line-height: 1.4; }
.kachel-fazit { background: var(--card-inset); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.45; color: var(--text-2); }

.boll { display: flex; flex-direction: column; gap: 6px; padding-top: 4px; }
.boll__bar { position: relative; height: 12px; border-radius: 999px; overflow: visible;
  background: linear-gradient(to right,
    var(--red) 0 25%, var(--yellow) 25% 35%, var(--blue) 35% 65%, var(--yellow) 65% 75%, var(--green) 75% 100%); }
.boll__marker { position: absolute; top: -5px; width: 6px; height: 22px; margin-left: -3px; border-radius: 3px; background: var(--text); box-shadow: 0 0 0 2px var(--bg); }
.boll__labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
.button-link { font-size: 14px; font-weight: 600; text-align: center; border: 1px solid #2E3640; border-radius: 10px; padding: 12px; text-decoration: none; display: block; }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { background: none; border: none; color: var(--muted); font-size: 12px; min-height: 36px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--line); color: var(--text); font-weight: 600; }
.ask { display: flex; gap: 8px; }
.ask input { flex: 1; min-width: 0; background: var(--card-inset); border: 1px solid var(--line); border-radius: 10px; color: var(--text); font-size: 14px; padding: 10px 12px; min-height: 44px; }
.ask input:focus { outline: none; border-color: var(--accent); }
.ask button { background: var(--line); border: none; border-radius: 10px; color: var(--text); font-size: 13px; font-weight: 600; padding: 0 14px; min-height: 44px; cursor: pointer; }
.ask button:disabled, .ask input:disabled { opacity: 0.5; }

/* Fusszeile */
.footer { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); padding: 0 4px; }
</style>
</head>
<body>
<main class="app">

  <header class="header">
    <h1>Markt-Cockpit</h1>
    <div class="live">
      <span class="live__row">
        <button type="button" class="switch" id="aiSwitch" role="switch" aria-checked="true" aria-label="Gemini ein- oder ausschalten" title="Gemini ein/aus" data-action="ai-toggle"></button>
        <span class="ai-badge" id="aiBadge" data-state="idle" title="Gemini-Verbindung">Gemini</span>
        <span class="live__badge" id="liveBadge">–</span>
      </span>
      <span class="info-row">
        <button type="button" class="refresh" id="refreshBtn" data-action="refresh" aria-label="Daten aktualisieren" title="Daten aktualisieren">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
        </button>
        <span class="live__info num" id="liveInfo">lädt…</span>
      </span>
    </div>
  </header>

  <section class="card" id="signalsCard" aria-label="Signale nach Zeithorizont">
    <div class="status-bar" id="overallBar" role="status">Gesamt: –</div>
    <div class="signals" id="signals"></div>
  </section>

  <section class="card" id="waveCard" aria-label="Wellen-Zyklus">
    <div class="status-bar" id="waveBar" role="status">Welle –</div>
    <div class="wave" id="waveChart"></div>
  </section>

  <section class="etfs" id="etfs" aria-label="ETFs"></section>

  <section class="card" id="tabsCard" aria-label="Details">
    <div class="tablist" role="tablist" id="tablist"></div>
    <div class="panel" id="tabPanel" role="tabpanel"></div>
  </section>

  <footer class="footer">
    <span class="num" id="build"></span>
    <span>© 2026 Leonardo Curcuruto</span>
  </footer>

</main>

<script>
"use strict";

/* ════════════════════════════════════════════════════════════
   1. KONFIGURATION
   ════════════════════════════════════════════════════════════ */

const CONFIG = {
  dataUrl: "data/market.json",          // erzeugt von .github/workflows/update-market.yml
  workerUrl: "https://adm-dashboard-proxy-google-api.siciliano-735.workers.dev",
  refreshUrl: "",                       // URL des Workers "cockpit-refresh" eintragen; leer = nur neu laden
  refreshMinutes: 5,
  staleMinutes: 90,                     // ältere Daten werden gelb markiert (bei offener Börse)
  maxAgeHours: 24,                      // älter als das: immer gelb und "veraltet"
  bottomFinderUrl: "https://de.tradingview.com/script/9iof2PC9/",
  tradingViewUrl: "https://www.tradingview.com/chart/NQ4ANQk2/?symbol=LSE%3ASWDA",
  analysisMaxAgeMin: 180,              // höchstens alle 3 h neu analysieren, ausser die Lage ändert sich
  storage: { gemini: "cockpit.gemini.v5", style: "analyseStyleLevel", aiOn: "cockpit.gemini.enabled" },   // v5: neuer Prompt (Zahlenformat)
};

// Ampel-Schwellen. level() liest: ab "yellow" gelb, ab "red" rot; lowerIsWorse kehrt die Richtung um.
const T = {
  vix:          { yellow: 20,  red: 25 },
  putCall:      { yellow: 0.6, red: 0.8 },
  fearGreed:    { greenLow: 45, greenHigh: 55, redLow: 25, redHigh: 75 },   // beidseitig: Angst UND Gier
  momentum:     { yellow: 75, red: 35, lowerIsWorse: true },
  breadth:      { yellow: 50, red: 35, lowerIsWorse: true },
  strength:     { yellow: 75, red: 35, lowerIsWorse: true },
  hySpread:     { yellow: 3.5, red: 5 },                  // High-Yield-Aufschlag in Prozentpunkten
  move:         { yellow: 70,  red: 110 },
  yieldCurve:   { yellow: 0.5, red: 0, lowerIsWorse: true },
  goldOilRatio: { yellow: 16,  red: 22 },
  oil:          { yellow: 60,  red: 90 },
  bitcoinPct:   { yellow: 2,   red: -2, lowerIsWorse: true },
  // Wellen-Modell (aus dem bisherigen Cockpit übernommen)
  phase: { overheatScore: 76, illusionBreadth: 35, illusionScoreMin: 35,
           knifeScore: 30, knifeVix: 24, correctionScore: 45, correctionBreadth: 45 },
};

// 8-Wellen-Zyklus: Ampel, Position in der Grafik, Erklärung
const PHASES = {
  W1: { level: "green",  x: 48,  y: 50, name: "Welle 1: Der Aufbruch", desc: "Erste zaghafte Erholung nach einem Bärenmarkt, meist von institutionellen Anlegern getragen." },
  W2: { level: "yellow", x: 82,  y: 62, name: "Welle 2: Der Rückstau", desc: "Scharfer Rücksetzer, weil die alte Angst nachwirkt. Welle 2 macht keine neuen Tiefs." },
  W3: { level: "green",  x: 150, y: 28, name: "Welle 3: Die breite Masse", desc: "Längste und stärkste Aufwärtsbewegung, getragen von guter Marktbreite." },
  W4: { level: "yellow", x: 186, y: 46, name: "Welle 4: Die Konsolidierung", desc: "Gewinnmitnahmen, unruhige Seitwärtsphase. Letzte gesunde Kaufgelegenheit." },
  W5: { level: "yellow", x: 236, y: 18, name: "Welle 5: Die Euphorie", desc: "Finale Übertreibung durch FOMO. Allzeithochs, während Grossanleger verkaufen." },
  A:  { level: "red",    x: 272, y: 56, name: "Welle A: Der Warnschuss", desc: "Erster abrupter Einbruch, von der Masse oft als Nachkaufchance unterschätzt." },
  B:  { level: "yellow", x: 304, y: 38, name: "Welle B: Markt-Illusion", desc: "Bullenfalle: Die Kurse steigen nochmals, die Marktbreite ist aber eingebrochen." },
  C:  { level: "red",    x: 366, y: 80, name: "Welle C: Die Kapitulation", desc: "Panikphase mit scharfem Abverkauf unter das Niveau von Welle A. Danach startet ein neuer Zyklus." },
};
const PHASE_ORDER = ["W1", "W2", "W3", "W4", "W5", "A", "B", "C"];

const TABS = [
  { id: "fazit",  label: "Fazit" },
  { id: "action", label: "Action" },
  { id: "diag",   label: "Diagnose" },
  { id: "ind",    label: "Indikatoren" },
  { id: "boll",   label: "Bollinger" },
  { id: "frage",  label: "Frage" },
];

const ETF_ICONS = { core: "globe", equal: "bars", emerging: "sprout" };

const STYLE_LEVELS = [
  { label: "Einsteiger", prompt: "Erkläre sehr einfach, ohne Fachbegriffe. Ein Alltagsvergleich ist erlaubt, darf aber kein Risiko verharmlosen." },
  { label: "Erfahren",   prompt: "Erkläre für Anleger mit Grundkenntnissen. Übliche Fachbegriffe sind ok." },
  { label: "Profi",      prompt: "Knapp und fachlich präzise, Fachbegriffe ohne Erklärung." },
];

/* ════════════════════════════════════════════════════════════
   2. HILFSFUNKTIONEN
   ════════════════════════════════════════════════════════════ */
const $ = (id) => document.getElementById(id);

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const isNum = (n) => typeof n === "number" && Number.isFinite(n);

const fmt = (n, digits = 2) => isNum(n)
  ? n.toLocaleString("de-CH", { minimumFractionDigits: digits, maximumFractionDigits: digits }).replace(".", ",")
  : "–";

const fmtPct = (n, digits = 1) => isNum(n) ? (n > 0 ? "+" : n < 0 ? "−" : "") + fmt(Math.abs(n), digits) + " %" : "–";

async function fetchJSON(url, options = {}, timeoutMs = 15000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const res = await fetch(url, { ...options, signal: ctrl.signal });
    if (!res.ok) throw Object.assign(new Error(`HTTP ${res.status}`), { status: res.status });
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

const store = {
  get(key) { try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } },
  set(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch { /* voll oder gesperrt */ } },
};

/* ════════════════════════════════════════════════════════════
   3. DATEN
   ════════════════════════════════════════════════════════════ */
const loadMarket = () => fetchJSON(`${CONFIG.dataUrl}?t=${Date.now()}`);

/* ════════════════════════════════════════════════════════════
   4. LOGIK
   ════════════════════════════════════════════════════════════ */
function level(value, t) {
  if (!isNum(value)) return "none";
  if (t.lowerIsWorse) return value <= t.red ? "red" : value <= t.yellow ? "yellow" : "green";
  return value >= t.red ? "red" : value >= t.yellow ? "yellow" : "green";
}

// Angst & Gier: beide Extreme sind ein Warnsignal
function fearGreedLevel(v) {
  const t = T.fearGreed;
  if (!isNum(v)) return "none";
  if (v < t.redLow || v > t.redHigh) return "red";
  return v >= t.greenLow && v <= t.greenHigh ? "green" : "yellow";
}

// Richtung ggü. Vortag aus Sicht des Marktes: worse | better | same
function trend(value, prev, lowerIsWorse = false, tolerancePct = 1) {
  if (!isNum(value) || !isNum(prev) || prev === 0) return "same";
  const chg = ((value - prev) / Math.abs(prev)) * 100;
  if (Math.abs(chg) < tolerancePct) return "same";
  return (lowerIsWorse ? chg < 0 : chg > 0) ? "worse" : "better";
}

// Ampel einer Gruppe: 2+ rot = rot, 1 rot oder 2+ gelb = gelb, sonst grün
function groupLevel(levels) {
  const valid = levels.filter((l) => l !== "none");
  if (!valid.length) return "none";
  const reds = valid.filter((l) => l === "red").length;
  const yellows = valid.filter((l) => l === "yellow").length;
  return reds >= 2 ? "red" : reds === 1 || yellows >= 2 ? "yellow" : "green";
}

// Gesamt über die fünf Smileys: 0–1 rot = grün, 2–3 = gelb, 4–5 = rot
function overallLevel(levels) {
  if (levels.every((l) => l === "none")) return "none";
  const reds = levels.filter((l) => l === "red").length;
  return reds >= 4 ? "red" : reds >= 2 ? "yellow" : "green";
}

function fruehwarnerLevel(fw) {
  if (!fw) return "none";
  const reds = ["smallCaps", "breadth", "credit"].filter((k) => fw[k]?.red).length;
  return reds >= 3 ? "red" : reds === 2 ? "yellow" : "green";
}

// Erholungs-Radar: 3 grün = Boden wahrscheinlich, 2 = erste Zeichen, 0–1 = noch kein Boden (rot)
function erholungLevel(er) {
  if (!er) return "none";
  const greens = ["fearTurn", "vixCurve", "credit"].filter((k) => er[k]?.green).length;
  return greens >= 3 ? "green" : greens === 2 ? "yellow" : "red";
}
const ERHOLUNG_TEXT = { green: "Boden wahrscheinlich", yellow: "Erste Zeichen", red: "Noch kein Boden", none: "Keine Daten" };

// Wellen-Modell: Phase aus Angst & Gier, Marktbreite und VIX
function detectPhase(fg, breadth, vix) {
  const p = T.phase;
  if (!isNum(fg)) return { code: null, status: "Keine Daten" };
  if (fg >= p.overheatScore) return { code: "W5", status: "Überhitzt" };
  if (isNum(breadth) && breadth < p.illusionBreadth && fg >= p.illusionScoreMin) return { code: "B", status: "Markt-Illusion" };
  if (fg < p.knifeScore && isNum(vix) && vix > p.knifeVix) return { code: "C", status: "Fallendes Messer" };
  if (fg < p.correctionScore || (isNum(breadth) && breadth < p.correctionBreadth)) return { code: "A", status: "Korrektur" };
  return { code: "W3", status: "Gesund" };
}

// Marktdiagnose = Welle × Frühwarner × Erholungs-Radar
function diagnose(phase, fwLevel, erLevel) {
  const down = phase === "A" || phase === "C";
  const up = phase === "W1" || phase === "W3" || phase === "W5";
  const fwRed = fwLevel === "red";
  if (!phase) return { level: "none", title: "Keine Diagnose", text: "Es fehlen Daten." };
  if (down && erLevel === "green") return { level: "green", title: "Boden in Sicht – Kaufgelegenheit",
    text: "Die Panik lässt nach: Angst, VIX und Kreditmarkt entspannen sich. Eine gute Phase für die nächste Tranche." };
  if (down && erLevel === "yellow" && !fwRed) return { level: "green", title: "Korrektur mit ersten Erholungszeichen",
    text: "Der Markt ist gesund und die Panik beginnt nachzulassen. Ein Boden ist noch nicht bestätigt." };
  if (down && !fwRed) return { level: "green", title: "Korrektur im gesunden Markt",
    text: "Der Rückgang dürfte begrenzt bleiben. Kippt der Frühwarner, wird daraus ein breiter Abwärtstrend." };
  if (down && fwRed) return { level: "red", title: "Breiter Abwärtstrend",
    text: "Welle C kann tief laufen. Nur gestaffelt investieren." };
  if (phase === "B" && fwRed) return { level: "red", title: "Bullenfalle", text: "Die Erholung hat keine breite Basis." };
  if (up && fwRed) return { level: "yellow", title: "Divergenz – mögliches Top", text: "Der Index steigt, der breite Markt bröckelt." };
  return { level: "green", title: "Gesunder Trend", text: "Kein Handlungsbedarf." };
}

// "Mo 23.11." in Zürcher Zeit
function dayDate(d) {
  const p = Object.fromEntries(new Intl.DateTimeFormat("de-CH", { timeZone: "Europe/Zurich", weekday: "short", day: "2-digit", month: "2-digit" })
    .formatToParts(d).map((x) => [x.type, x.value]));
  return `${p.weekday.replace(".", "")} ${p.day}.${p.month}.`;
}

// "2026-11-20" → "20.11."
const isoToDayMonth = (iso) => (/^\d{4}-\d{2}-\d{2}$/.test(iso || "") ? `${iso.slice(8, 10)}.${iso.slice(5, 7)}.` : "");

function marketClock(updatedIso, now = new Date()) {
  const ny = new Date(now.toLocaleString("en-US", { timeZone: "America/New_York" }));
  const day = ny.getDay();
  const mins = ny.getHours() * 60 + ny.getMinutes();
  const open = day >= 1 && day <= 5 && mins >= 570 && mins < 960;          // 9:30–16:00 New York
  const zh = (d) => d.toLocaleTimeString("de-CH", { timeZone: "Europe/Zurich", hour: "2-digit", minute: "2-digit" });
  const updated = updatedIso ? new Date(updatedIso) : null;
  const ageMin = updated ? (now - updated) / 60000 : Infinity;
  const tooOld = ageMin > CONFIG.maxAgeHours * 60;
  return {
    open,
    stale: (open && ageMin > CONFIG.staleMinutes) || tooOld,
    label: updated ? `Stand ${dayDate(updated)} ${zh(updated)}${tooOld ? " · veraltet" : ""}` : "Keine Daten",
  };
}

// Alle Anzeigewerte an einem Ort aus den Rohdaten berechnen
function buildModel(m) {
  const s = m.sentiment || {};
  const parts = s.parts || {};
  const q = m.quotes || {};
  const r = m.rates || {};
  const score = (k) => parts[k]?.score;

  const fg = s.fearGreed?.value;
  const vix = s.vix?.value;
  const breadth = score("stock_price_breadth");
  const phase = detectPhase(fg, breadth, vix);
  const phaseLevel = phase.code ? PHASES[phase.code].level : "none";
  const fwLevel = fruehwarnerLevel(m.fruehwarner);
  const erLevel = erholungLevel(m.erholung);
  const ratio = isNum(q.gold?.value) && isNum(q.oil?.value) && q.oil.value > 0 ? q.gold.value / q.oil.value : null;

  // Einzelindikatoren je Kachel
  const row = (name, value, lvl, desc, tr = "same") => ({ name, value, level: lvl, desc, trend: tr });
  const groups = [
    { id: "sentiment", name: "Sentiment & Nervosität", rows: [
      row("VIX", fmt(vix, 1), level(vix, T.vix), "Angst-Index: erwartete Schwankung des S&P 500. Unter 20 ruhig, über 25 Stress.", trend(vix, s.vix?.prev)),
      row("Angst & Gier", isNum(fg) ? `${Math.round(fg)} / 100` : "–", fearGreedLevel(fg), "CNN-Stimmungsbarometer aus sieben Faktoren. Beide Extreme sind Warnsignale.", trend(fg, s.fearGreed?.prev, true)),
      row("Put/Call", fmt(s.putCall?.value, 2), level(s.putCall?.value, T.putCall), "Absicherungen im Verhältnis zu Wetten auf steigende Kurse (5-Tage-Schnitt).", trend(s.putCall?.value, s.putCall?.prev)),
      row("Bitcoin 24 h", fmtPct(q.bitcoin?.changePct), level(q.bitcoin?.changePct, T.bitcoinPct), `Fiebermesser für Risikolust. Kurs: ${fmt(q.bitcoin?.value, 0)} USD.`),
    ]},
    { id: "trend", name: "Trend- & Sicherheits-Schutz", rows: [
      row("Sicherheits-Ampel", phase.status, phaseLevel, phase.code ? PHASES[phase.code].name : "–"),
      row("Markt-Schwung", isNum(score("market_momentum_sp500")) ? `${Math.round(score("market_momentum_sp500"))} / 100` : "–", level(score("market_momentum_sp500"), T.momentum), "S&P 500 im Vergleich zu seinem 125-Tage-Schnitt (CNN)."),
      row("Marktbreite", isNum(breadth) ? `${Math.round(breadth)} / 100` : "–", level(breadth, T.breadth), "Steigen viele oder nur wenige Aktien? Unter 35 trägt nur noch eine Minderheit den Markt."),
    ]},
    { id: "struktur", name: "Markt-Struktur & Liquidität", rows: [
      row("Aktien-Stärke", isNum(score("stock_price_strength")) ? `${Math.round(score("stock_price_strength"))} / 100` : "–", level(score("stock_price_strength"), T.strength), "Aktien auf 52-Wochen-Hochs im Vergleich zu Tiefs."),
      row("Credit Spreads", isNum(r.hySpread?.value) ? fmt(r.hySpread.value, 2) + " %" : "–", level(r.hySpread?.value, T.hySpread), "Aufschlag von Hochzinsanleihen gegenüber Staatsanleihen. Steigt er, wächst der Stress im Kreditmarkt.", trend(r.hySpread?.value, r.hySpread?.prev)),
      row("MOVE-Index", fmt(q.move?.value, 1), level(q.move?.value, T.move), "Erwartete Schwankung von US-Staatsanleihen, das Gegenstück zum VIX.", trend(q.move?.value, q.move?.prev)),
      row("Zinskurve 10J–2J", isNum(r.yieldCurve?.value) ? fmtPct(r.yieldCurve.value, 2).replace(" %", " pp") : "–", level(r.yieldCurve?.value, T.yieldCurve), "Unter 0 ist die Kurve invertiert, historisch ein Rezessionsvorbote.", trend(r.yieldCurve?.value, r.yieldCurve?.prev, true)),
    ]},
    { id: "rohstoffe", name: "Rohstoffe: Öl & Gold", rows: [
      row("Gold-Öl-Ratio", isNum(ratio) ? `${fmt(ratio, 1)} : 1` : "–", level(ratio, T.goldOilRatio), "Hoch = Krisenstimmung, tief = starkes Wachstum."),
      row("Gold", isNum(q.gold?.value) ? fmt(q.gold.value, 0) + " USD" : "–", "none", "Sicherer Hafen in unruhigen Zeiten (Future, Unze).", trend(q.gold?.value, q.gold?.prev, true)),
      row("Öl (WTI)", isNum(q.oil?.value) ? fmt(q.oil.value, 2) + " USD" : "–", level(q.oil?.value, T.oil), "Spiegel der globalen Energienachfrage.", trend(q.oil?.value, q.oil?.prev)),
    ]},
  ];
  groups.forEach((g) => { g.level = groupLevel(g.rows.map((x) => x.level)); });

  const signals = [
    { name: "Puls", src: "VIX", tab: "ind", value: fmt(vix, 1), range: "20 | 25", level: level(vix, T.vix), trend: trend(vix, s.vix?.prev) },
    { name: "Schutz", src: "Put/Call", tab: "ind", value: fmt(s.putCall?.value, 2), range: "0,6 | 0,8", level: level(s.putCall?.value, T.putCall), trend: trend(s.putCall?.value, s.putCall?.prev) },
    { name: "Stimmung", src: "Angst&Gier", tab: "ind", value: isNum(fg) ? Math.round(fg) : "–", range: "45 | 25", level: fearGreedLevel(fg), trend: trend(fg, s.fearGreed?.prev, true) },
    { name: "Früh&shy;warner", src: "3 Signale", tab: "diag", lights: m.fruehwarner || {}, level: fwLevel, trend: "same" },
    { name: "Welle", src: "Elliott", tab: "diag", value: phase.code || "–", level: phaseLevel, trend: "same" },
    { name: "Erholung", src: "3 Signale", tab: "diag", recovery: m.erholung || {}, level: erLevel, trend: "same", inOverall: false },
  ];

  return {
    raw: m, groups, signals, phase, phaseLevel, fwLevel, erLevel,
    // Gesamtampel wie bisher nur aus den fünf Warn-Smileys; Erholung zählt nicht mit
    overall: overallLevel(signals.filter((x) => x.inOverall !== false).map((x) => x.level)),
    diag: diagnose(phase.code, fwLevel, erLevel),
    clock: marketClock(m.updated),
  };
}

   5. GEMINI (über Cloudflare Worker, der Key bleibt im Worker)
   ════════════════════════════════════════════════════════════ */
// Erzwingt gültiges JSON in genau dieser Form
const ANALYSIS_SCHEMA = {
  type: "OBJECT",
  properties: {
    fazit: { type: "STRING" },
    actions: { type: "ARRAY", items: { type: "OBJECT", properties: { title: { type: "STRING" }, text: { type: "STRING" } }, required: ["title", "text"] } },
    kacheln: { type: "OBJECT", properties: { sentiment: { type: "STRING" }, trend: { type: "STRING" }, struktur: { type: "STRING" }, rohstoffe: { type: "STRING" } } },
  },
  required: ["fazit", "actions", "kacheln"],
};

// Gemini liefert Umlaute teils als HTML-Codes (&#228; = ä). Zurückwandeln, ohne HTML auszuführen.
function decodeEntities(t) {
  const ta = document.createElement("textarea");
  ta.innerHTML = t;
  return ta.value;
}

// Schreibweise absichern: echte Umlaute, nie ß (Schweiz)
const swissSpelling = (t) => decodeEntities(String(t ?? "")).replace(/ß/g, "ss");

// Alle Texte in einem Gemini-Ergebnis bereinigen (auch verschachtelt)
const cleanTexts = (v) => typeof v === "string" ? swissSpelling(v)
  : Array.isArray(v) ? v.map(cleanTexts)
  : v && typeof v === "object" ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, cleanTexts(x)]))
  : v;

async function callGemini(prompt, schema = null) {
  const body = {
    contents: [{ role: "user", parts: [{ text: prompt }] }],
    generationConfig: { temperature: 0.3, ...(schema ? { responseMimeType: "application/json", responseSchema: schema } : {}) },
  };
  setGeminiStatus("busy");
  try {
    const res = await fetchJSON(CONFIG.workerUrl, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    }, 95000);   // Cloudflare bricht nach 100 s ab
    // Denk-Teile (thought) überspringen, nur die eigentliche Antwort verwenden
    const text = (res?.candidates?.[0]?.content?.parts || []).filter((p) => !p.thought).map((p) => p.text || "").join("");
    if (!text) throw new Error("Leere Antwort");
    setGeminiStatus("ok");
    return schema ? text : swissSpelling(text);   // JSON wird nach dem Einlesen bereinigt
  } catch (err) {
    setGeminiStatus("fail");
    throw err;
  }
}

function parseJsonLoose(text) {
  const clean = text.replace(/```json|```/g, "").trim();
  try { return JSON.parse(clean); } catch { /* weiter unten */ }
  const start = clean.indexOf("{"), end = clean.lastIndexOf("}");
  return JSON.parse(clean.slice(start, end + 1));
}

function geminiFacts(model) {
  const m = model.raw;
  return {
    welle: model.phase.code, welle_status: model.phase.status, marktdiagnose: model.diag.title,
    gesamtampel: model.overall, fruehwarner: m.fruehwarner,
    erholungs_radar: { status: ERHOLUNG_TEXT[model.erLevel], details: m.erholung },
    angst_gier: m.sentiment?.fearGreed, vix: m.sentiment?.vix, put_call: m.sentiment?.putCall,
    cnn_teilindikatoren: m.sentiment?.parts, kurse: m.quotes, zinsen: m.rates,
    etfs: m.etfs, bollinger_swda: m.bollinger,
    // So stehen die Werte in den Kacheln. Gemini soll genau diese Schreibweise verwenden.
    anzeige: {
      vix: fmt(m.sentiment?.vix?.value, 1), vix_vortag: fmt(m.sentiment?.vix?.prev, 1),
      angst_gier: isNum(m.sentiment?.fearGreed?.value) ? String(Math.round(m.sentiment.fearGreed.value)) : "–",
      angst_gier_vortag: isNum(m.sentiment?.fearGreed?.prev) ? String(Math.round(m.sentiment.fearGreed.prev)) : "–",
      put_call: fmt(m.sentiment?.putCall?.value, 2),
      sp500_veraenderung: fmtPct(m.quotes?.sp500?.changePct, 1),
    },
  };
}

function buildPrompt(model, styleIdx) {
  return `Du bist ein besonnener Marktstratege. Dein Leser ist ein langfristiger Privatanleger in der Schweiz
(Anlagehorizont 10–15 Jahre, drei Welt-ETFs: MSCI Core, MSCI Equal Weight, MSCI Emerging; gestaffelter Einstieg).
Sprachniveau: ${STYLE_LEVELS[styleIdx].prompt}

REGELN:
1. Nutze ausschliesslich die Daten unten. Erfinde keine Zahlen, keine Unternehmensnachrichten.
2. Die Welle und die Marktdiagnose sind gesetzt. Widersprich ihnen nicht.
   Nenne neben Risiken auch positive Anzeichen (Erholungs-Radar, Frühwarner), wenn die Daten sie zeigen.
3. Weder beschönigen noch dramatisieren. Chancen und Risiken gleich gewichten.
4. Rechtschreibung: Verwende IMMER die Umlaute ä, ö, ü, Ä, Ö, Ü – niemals ae, oe, ue als Ersatz.
   Verwende NIE das Zeichen ß, schreibe immer ss (Schweizer Rechtschreibung). Du-Form.
   Schreibe reinen Text: keine HTML-Codes wie &#228; oder &auml;, kein Markdown.
5. Zahlen: Übernimm VIX, Angst & Gier, Put/Call und S&P-500-Veränderung exakt aus "anzeige"
   (Dezimalkomma, gleiche Rundung). Alle übrigen Zahlen ebenfalls mit Dezimalkomma.

Antworte NUR mit diesem JSON:
{"fazit": "3–4 Sätze Fliesstext zur Gesamtlage inkl. wichtigster Veränderung zum Vortag",
 "actions": [{"title": "max. 5 Wörter", "text": "1 Satz"}],
 "kacheln": {"sentiment": "1–2 Sätze", "trend": "1–2 Sätze", "struktur": "1–2 Sätze", "rohstoffe": "1–2 Sätze"}}
Genau 4 Actions, handlungsorientiert.

DATEN:
${JSON.stringify(geminiFacts(model))}`;
}

// Gratis-Stufe von Gemini: nur wenige Anfragen pro Tag. Deshalb wird nur neu analysiert,
// wenn sich die Lage ändert oder die letzte Analyse älter als CONFIG.analysisMaxAgeMin ist.
const situationKey = (model) => [model.phase.code, model.overall, model.fwLevel, model.erLevel, model.diag.title].join("|");

async function getAnalysis(model, styleIdx) {
  const cache = store.get(CONFIG.storage.gemini) || {};
  const hit = cache[styleIdx];
  const fresh = hit && hit.key === situationKey(model) && Date.now() - hit.at < CONFIG.analysisMaxAgeMin * 60000;
  if (fresh) return hit.texts;
  if (!ui.aiOn) return null;   // Schieber aus: keine Anfrage an Gemini

  let out;
  try {
    out = parseJsonLoose(await callGemini(buildPrompt(model, styleIdx), ANALYSIS_SCHEMA));
  } catch (err) {
    if (!(err instanceof SyntaxError)) throw err;          // nur bei kaputtem JSON nochmals versuchen
    out = parseJsonLoose(await callGemini(buildPrompt(model, styleIdx), ANALYSIS_SCHEMA));
  }
  if (typeof out.fazit !== "string" || !Array.isArray(out.actions)) throw new Error("Unerwartetes Format");
  out = cleanTexts(out);
  cache[styleIdx] = { key: situationKey(model), at: Date.now(), texts: out };
  store.set(CONFIG.storage.gemini, cache);
  return out;
}

// Verständliche Fehlermeldung je nach Ursache
function geminiErrorText(err) {
  if (err?.status === 429) return "Das Gemini-Kontingent der Gratis-Stufe ist aufgebraucht. Später nochmals versuchen.";
  if (err?.name === "AbortError" || err?.status === 524) return "Gemini hat zu lange gebraucht. Später nochmals versuchen.";
  return "Gemini ist gerade nicht erreichbar.";
}

async function askQuestion(model, question, styleIdx) {
  const prompt = `Du bist ein besonnener Marktstratege. Sprachniveau: ${STYLE_LEVELS[styleIdx].prompt}
Aktuelle Cockpit-Daten (nur nutzen, falls relevant): ${JSON.stringify({ welle: model.phase.code, diagnose: model.diag.title, angst_gier: model.raw.sentiment?.fearGreed?.value, vix: model.raw.sentiment?.vix?.value })}
Frage: "${question}"
Antworte in höchstens 4 Sätzen als Fliesstext. Verwende immer die Umlaute ä, ö, ü (nie ae, oe, ue) und nie ß, sondern ss.`;
  return (await callGemini(prompt)).trim();
}

const dot = (lvl, label = "") => `<span class="dot" data-level="${lvl}"${label ? ` title="${esc(label)}"` : ""}></span>`;

const GEMINI_STATUS_TEXT = { off: "Gemini: ausgeschaltet", idle: "Gemini: noch nicht abgefragt", busy: "Gemini: Anfrage läuft", ok: "Gemini: erreichbar", fail: "Gemini: nicht erreichbar" };
let geminiBusy = 0;
function setGeminiStatus(state) {
  if (state === "busy") geminiBusy++;
  else geminiBusy = Math.max(0, geminiBusy - 1);
  const shown = geminiBusy > 0 ? "busy" : ui.aiOn ? state : "off";
  const el = $("aiBadge");
  el.dataset.state = shown;
  el.title = GEMINI_STATUS_TEXT[shown];
  el.setAttribute("aria-label", GEMINI_STATUS_TEXT[shown]);
}

function renderAiSwitch() {
  $("aiSwitch").setAttribute("aria-checked", String(ui.aiOn));
  if (geminiBusy === 0) {
    const state = ui.aiOn ? "idle" : "off";
    $("aiBadge").dataset.state = state;
    $("aiBadge").title = GEMINI_STATUS_TEXT[state];
    $("aiBadge").setAttribute("aria-label", GEMINI_STATUS_TEXT[state]);
  }
}

function renderHeader(model) {
  const c = model.clock;
  const hasData = Boolean(model.raw.updated);
  $("liveBadge").dataset.state = !hasData ? "offline" : c.open ? "live" : "closed";
  $("liveBadge").textContent = !hasData ? "OFFLINE" : c.open ? "LIVE" : "SCHLUSS";
  $("liveInfo").textContent = c.label;
  $("liveInfo").dataset.stale = c.stale;
  $("build").textContent = `Build ${APP_VERSION}`;
}

function renderSignals(model) {
  $("overallBar").dataset.level = model.overall;
  $("overallBar").textContent = `Gesamt: ${LEVEL_TEXT[model.overall]}`;
  $("signalsCard").dataset.level = model.overall;
  const sig = (x) => (x ? (x.red ? "red" : "green") : "none");
  const pos = (x) => (x ? (x.green ? "green" : "none") : "none");   // Erholung: grün oder grau
  $("signals").innerHTML = model.signals.map((s) => {
    const value = s.lights
      ? `<span class="lights">${dot(sig(s.lights.smallCaps), "Small Caps")}${dot(sig(s.lights.breadth), "Breite")}${dot(sig(s.lights.credit), "Kredit")}</span>`
      : s.recovery
      ? `<span class="lights">${dot(pos(s.recovery.fearTurn), "Angst dreht")}${dot(pos(s.recovery.vixCurve), "VIX entspannt")}${dot(pos(s.recovery.credit), "Kredit beruhigt")}</span>`
      : `<span class="signal__value num">${esc(s.value)}</span>`;
    return `<button type="button" class="signal" data-tab="${s.tab}" aria-label="${s.name.replace("&shy;", "")}: ${LEVEL_TEXT[s.level]}">
      ${smiley(s.level, 32)}<span class="signal__name">${s.name}</span><span class="signal__src">${s.src}</span>
      ${value}<span class="signal__range num">${s.range || ""}</span>${arrow(s.trend)}</button>`;
  }).join("");
}

function renderWave(model) {
  const code = model.phase.code;
  const lvl = model.phaseLevel;
  const curIdx = code ? PHASE_ORDER.indexOf(code) : -1;
  const pts = [[10, 76], ...PHASE_ORDER.map((k) => [PHASES[k].x, PHASES[k].y])];
  const poly = (from, to) => pts.slice(from, to + 1).map((p) => p.join(",")).join(" ");
  const labels = PHASE_ORDER.map((k, i) => {
    const p = PHASES[k];
    const cur = i === curIdx;
    const above = ["W1", "W3", "W5", "B"].includes(k);
    const col = cur ? COLOR[lvl] : k === "W5" ? "var(--violet)" : "#AEB6C0";
    const anchor = k === "C" ? "end" : "middle";
    return `<circle cx="${p.x}" cy="${p.y}" r="${cur ? 6 : 3}" fill="${col}"/>`
      + `<text x="${k === "C" ? p.x - 10 : p.x}" y="${above ? p.y - 9 : p.y + 17}" text-anchor="${anchor}" font-size="12" font-weight="${cur ? 700 : 500}" fill="${col}">${k}${cur ? " · IST" : ""}</text>`;
  }).join("");

  $("waveCard").dataset.level = lvl;
  $("waveBar").dataset.level = lvl;
  $("waveBar").innerHTML = `Welle ${esc(code || "–")} · ${esc(model.phase.status)} <a href="#tabsCard" data-tab="diag">Details</a>`;
  $("waveChart").innerHTML = `<svg viewBox="0 0 388 100" role="img" aria-label="Wellen-Zyklus, aktuell Welle ${esc(code || "unbekannt")}">
    <rect x="236" y="14" width="68" height="50" fill="var(--red)" opacity="0.08"/>
    <line x1="0" y1="18" x2="388" y2="18" stroke="var(--line)" stroke-dasharray="3 3"/>
    <line x1="0" y1="76" x2="388" y2="76" stroke="var(--line)" stroke-dasharray="3 3"/>
    <polyline points="${poly(0, pts.length - 1)}" fill="none" stroke="#3A424D" stroke-width="2" stroke-linejoin="round"/>
    ${curIdx >= 0 ? `<polyline points="${poly(0, curIdx + 1)}" fill="none" stroke="#6B7480" stroke-width="2.5" stroke-linejoin="round"/>
    <polyline points="${poly(curIdx, curIdx + 1)}" fill="none" stroke="${COLOR[lvl]}" stroke-width="3" stroke-linejoin="round"/>` : ""}
    ${labels}</svg>`;
}

function renderEtfs(model) {
  const etfs = model.raw.etfs || {};
  $("etfs").innerHTML = Object.entries(ETF_ICONS).map(([key, ic]) => {
    const e = etfs[key];
    if (!e) return `<div class="etf"><span class="etf__name">${icon(ic)}–</span></div>`;
    const dir = e.changePct > 0 ? "up" : e.changePct < 0 ? "down" : "flat";
    return `<div class="etf">
      <span class="etf__name">${icon(ic)}${esc(e.name)}</span>
      <span class="etf__price num">${fmt(e.price, 2)}<span class="etf__cur"> ${esc(e.currency)}</span></span>
      <span class="etf__chg num" data-dir="${dir}">${arrow(dir === "up" ? "better" : dir === "down" ? "worse" : "same")}${fmtPct(e.changePct)}</span>
      ${e.date ? `<span class="etf__date num">Kurs ${isoToDayMonth(e.date)}</span>` : ""}
    </div>`;
  }).join("");
}

/* ── Tabs ───────────────────────────────────────────────────── */
const ui = {
  tab: "fazit",
  group: null,               // geöffnete Kachel im Indikatoren-Tab
  analysis: null,            // Gemini-Ergebnis
  analysisState: "loading",  // loading | ok | error | nodata
  analysisError: "",
  answer: null,
  asking: false,
  style: Number.isInteger(store.get(CONFIG.storage.style)) ? store.get(CONFIG.storage.style) : 1,
  aiOn: store.get(CONFIG.storage.aiOn) !== false,   // Standard: ein
};

function renderTabs() {
  $("tablist").innerHTML = TABS.map((t) =>
    `<button type="button" class="tab" role="tab" data-tab="${t.id}" aria-selected="${t.id === ui.tab}">${t.label}</button>`).join("");
}

const analysisNote = () => ui.analysisState === "off"
  ? `<p class="muted">Gemini ist ausgeschaltet. Du siehst die berechneten Werte.</p>`
  : ui.analysisState === "nodata"
  ? `<p class="error-text">Noch keine Marktdaten. Starte auf GitHub unter Actions den Workflow „Marktdaten aktualisieren“.</p>`
  : ui.analysisState === "loading"
  ? `<p class="loading">Gemini formuliert die Analyse… (bis 60 Sekunden)</p>`
  : `<p class="error-text">${esc(ui.analysisError)} Bis dahin siehst du die berechneten Werte.</p>`;

const PANELS = {
  fazit(model) {
    const text = ui.analysis ? `<p>${esc(ui.analysis.fazit)}</p>` : `${analysisNote()}<p>${esc(model.diag.title)}. ${esc(model.diag.text)}</p>`;
    return `${text}
      <div class="block">
        <h3>Sprachniveau</h3>
        <div class="seg" role="group" aria-label="Sprachniveau">${STYLE_LEVELS.map((s, i) =>
          `<button type="button" data-style="${i}" aria-pressed="${i === ui.style}">${s.label}</button>`).join("")}</div>
      </div>`;
  },

  frage() {
    if (!ui.aiOn) return `<h3>Frage an Gemini</h3><p class="muted">Gemini ist ausgeschaltet. Schalte es oben mit dem Schieber ein.</p>`;
    return `<h3>Frage an Gemini</h3>
      <form class="ask" data-action="ask">
        <input type="text" name="q" placeholder="z. B. Was bedeutet ein MOVE über 110?" aria-label="Frage an Gemini" ${ui.asking ? "disabled" : ""}>
        <button type="submit" ${ui.asking ? "disabled" : ""}>Fragen</button>
      </form>
      ${ui.asking ? `<p class="loading">Gemini antwortet… (meist 15–30 Sekunden)</p>` : ui.answer ? `<p>${esc(ui.answer)}</p>` : ""}`;
  },

  action() {
    if (!ui.analysis) return analysisNote();
    return ui.analysis.actions.slice(0, 4).map((a, i) => `
      <div class="action"><span class="action__nr">${i + 1}</span>
        <div><div class="action__title">${esc(a.title)}</div><div class="action__text">${esc(a.text)}</div></div>
      </div>`).join("");
  },

  ind(model) {
    if (ui.group != null) return renderGroupDetail(model, ui.group);
    const errors = model.raw.errors?.length ? `<p class="muted" style="font-size:12px">Nicht verfügbar: ${esc(model.raw.errors.map((e) => e.split(":")[0]).join(", "))}</p>` : "";
    return `<div>${[...model.groups, { id: "bottom", name: "S&P 500 Bottom Finder", level: model.phaseLevel }].map((g) =>
      `<button type="button" class="row-btn" data-group="${g.id}">${dot(g.level)}<span>${esc(g.name)}</span>${icon("right", 14, "#6B7480")}</button>`).join("")}</div>${errors}`;
  },

  diag(model) {
    const fw = model.raw.fruehwarner || {};
    const er = model.raw.erholung || {};
    const sig = (x) => (x ? (x.red ? "red" : "green") : "none");
    const pos = (x) => (x ? (x.green ? "green" : "none") : "none");   // positive Signale: grün oder grau
    const kv = (lvl, a, b) => `<div class="kv">${dot(lvl)}<span>${a}</span><span class="num">${b}</span></div>`;
    const ph = model.phase.code ? PHASES[model.phase.code] : null;
    return `
      <div class="chips">
        <span class="chip">${dot(model.phaseLevel)}Welle ${esc(model.phase.code || "–")}</span>
        <span class="chip">${dot(model.fwLevel)}Frühwarner</span>
        <span class="chip">${dot(model.erLevel)}Erholung</span>
      </div>
      <div class="verdict" data-level="${model.diag.level}">${esc(model.diag.title)}</div>
      <p class="muted">${esc(model.diag.text)}</p>
      <div class="block"><h3>Frühwarner · vs. 50-Tage-Schnitt</h3>
        ${kv(sig(fw.smallCaps), "Small Caps", fw.smallCaps ? fmtPct(fw.smallCaps.diffPct) : "–")}
        ${kv(sig(fw.breadth), "Marktbreite", fw.breadth ? fmtPct(fw.breadth.diffPct) : "–")}
        ${kv(sig(fw.credit), "Kredit-Spreads", fw.credit ? fmt(fw.credit.value, 2) + " %" : "–")}
      </div>
      <div class="block"><h3>Erholungs-Radar · ${ERHOLUNG_TEXT[model.erLevel]}</h3>
        ${kv(pos(er.fearTurn), "Angst dreht", er.fearTurn ? `${fmt(er.fearTurn.value, 0)} (Tief ${fmt(er.fearTurn.min10, 0)})` : "–")}
        ${kv(pos(er.vixCurve), "VIX entspannt", er.vixCurve ? `${fmt(er.vixCurve.vix, 1)} vs. ${fmt(er.vixCurve.vix3m, 1)}` : "–")}
        ${kv(pos(er.credit), "Kredit beruhigt", er.credit ? `${fmt(er.credit.value, 2)} vs. ${fmt(er.credit.sma10, 2)}` : "–")}
      </div>
      ${ph ? `<div class="block"><h3>Aktuelle Phase</h3>
        <div class="phase" data-level="${ph.level}"><div class="phase__name">${esc(ph.name)}</div><div class="phase__desc">${esc(ph.desc)}</div></div></div>` : ""}`;
  },

  boll(model) {
    const b = model.raw.bollinger;
    if (!b) return `<p class="muted">Keine Bollinger-Daten.</p>`;
    const pb = b.percentB;
    // Position auf der Skala: 0 % = deutlich unter dem Band, 100 % = deutlich darüber
    const marker = Math.max(2, Math.min(98, ((pb + 0.5) / 2) * 100));
    const zone = pb < 0 ? { lvl: "red", t: "Stark gefallen", d: "Der Kurs liegt unter seinem üblichen Bereich der letzten 20 Tage. Das ist selten und oft folgt eine Gegenbewegung. Ein Boden ist damit aber nicht bestätigt." }
      : pb < 0.2 ? { lvl: "yellow", t: "Günstig", d: "Der Kurs liegt am unteren Rand seines üblichen Bereichs." }
      : pb <= 0.8 ? { lvl: "blue", t: "Normal", d: "Der Kurs bewegt sich im üblichen Bereich der letzten 20 Tage." }
      : pb <= 1 ? { lvl: "yellow", t: "Teuer", d: "Der Kurs liegt am oberen Rand seines üblichen Bereichs." }
      : { lvl: "green", t: "Stark gestiegen", d: "Der Kurs liegt über seinem üblichen Bereich. Oft folgt eine Verschnaufpause." };
    const swing = b.bandwidthPct > 8 ? "hoch" : b.bandwidthPct < 3 ? "tief" : "normal";
    return `
      <div class="kv"><span></span><span><b>iShares Core MSCI World</b></span><span>letzte 20 Tage</span></div>
      <div class="boll">
        <div class="boll__bar"><span class="boll__marker" style="left:${marker}%"></span></div>
        <div class="boll__labels"><span>stark gefallen</span><span>üblicher Bereich</span><span>stark gestiegen</span></div>
      </div>
      <div class="kv">${dot(zone.lvl)}<span class="verdict" data-level="${zone.lvl}">${zone.t}</span><span></span></div>
      <p>${zone.d}</p>
      <div class="kv">${dot("none")}<span>Schwankung</span><span>${swing} (${fmt(b.bandwidthPct, 1)} %)</span></div>
      ${b.returnedIntoBand ? `<div class="kv">${dot("green")}<span>Zurück im üblichen Bereich</span><span>positives Zeichen</span></div>` : ""}
      <a class="button-link" href="${CONFIG.tradingViewUrl}" target="_blank" rel="noopener">Chart in TradingView öffnen ↗</a>`;
  },
};

function renderGroupDetail(model, id) {
  const back = `<button type="button" class="back-btn" data-action="back">${icon("left", 14)}Alle Indikatoren</button>`;
  if (id === "bottom") {
    return `${back}
      <div class="kv">${dot(model.phaseLevel)}<span><b>Status: ${esc(model.phase.status)}</b></span><span>Welle ${esc(model.phase.code || "–")}</span></div>
      <p class="muted" style="font-size:13px">Angst & Gier ${fmt(model.raw.sentiment?.fearGreed?.value, 0)} / 100 · Marktbreite ${fmt(model.raw.sentiment?.parts?.stock_price_breadth?.score, 0)} / 100</p>
      <div class="block"><h3>Pre-Bottom-Signal (blau)</h3><p class="muted" style="font-size:13px">Weniger als 20 % der S&P-500-Aktien über ihrem 50-Tage-Schnitt (S5FI &lt; 20). Extrem schwache Breite, Gegenbewegung möglich.</p></div>
      <div class="block"><h3>Bottom-Signal (grün)</h3><p class="muted" style="font-size:13px">50-Tage-Schnitt der NYSE-Advance-Decline-Differenz steigt ggü. vor 10 Tagen, plus blaues Signal in den letzten 10 Bars.</p></div>
      <a class="button-link" href="${CONFIG.bottomFinderUrl}" target="_blank" rel="noopener">Script in TradingView öffnen ↗</a>`;
  }
  const g = model.groups.find((x) => x.id === id);
  const fazit = ui.analysis?.kacheln?.[id];
  return `${back}
    <div class="kv">${dot(g.level)}<span><b>${esc(g.name)}</b></span><span></span></div>
    <div>${g.rows.map((r) => `
      <div class="ind-row">${dot(r.level)}<span class="ind-row__name">${esc(r.name)}</span>
        <span class="ind-row__val num">${esc(r.value)}</span>${arrow(r.trend)}
        <span class="ind-row__desc">${esc(r.desc)}</span></div>`).join("")}</div>
    ${fazit ? `<div class="kachel-fazit">${esc(fazit)}</div>` : ""}`;
}

function renderPanel(model) {
  $("tabPanel").innerHTML = PANELS[ui.tab](model);
}

function renderAll(model) {
  renderHeader(model);
  renderSignals(model);
  renderWave(model);
  renderEtfs(model);
  renderTabs();
  renderPanel(model);
}

/* ════════════════════════════════════════════════════════════
   7. EREIGNISSE
   ════════════════════════════════════════════════════════════ */
function bindEvents() {
  document.addEventListener("click", (ev) => {
    if (ev.target.closest("[data-action='refresh']")) { manualRefresh(); return; }
    if (ev.target.closest("[data-action='ai-toggle']")) {
      ui.aiOn = !ui.aiOn;
      store.set(CONFIG.storage.aiOn, ui.aiOn);
      renderAiSwitch();
      if (model?.raw?.updated) loadAnalysis(); else if (model) renderPanel(model);
      return;
    }
    const el = ev.target.closest("[data-tab], [data-group], [data-action='back'], [data-style]");
    if (!el || !model) return;
    if (el.dataset.tab) {
      ev.preventDefault();
      ui.tab = el.dataset.tab;
      ui.group = null;
      renderTabs();
      if (!el.classList.contains("tab")) $("tabsCard").scrollIntoView({ behavior: "smooth", block: "start" });
    } else if (el.dataset.group) {
      ui.group = el.dataset.group;
    } else if (el.dataset.action === "back") {
      ui.group = null;
    } else if (el.dataset.style) {
      if (Number(el.dataset.style) === ui.style) return;
      ui.style = Number(el.dataset.style);
      store.set(CONFIG.storage.style, ui.style);
      ui.analysis = null;          // alten Text ausblenden, damit der Wechsel sichtbar ist
      loadAnalysis();
    }
    renderPanel(model);
  });

  document.addEventListener("submit", async (ev) => {
    if (ev.target.dataset.action !== "ask") return;
    ev.preventDefault();
    const question = new FormData(ev.target).get("q")?.toString().trim();
    if (!question || !model || !ui.aiOn) return;
    ui.asking = true; renderPanel(model);
    try { ui.answer = await askQuestion(model, question, ui.style); }
    catch (err) { ui.answer = geminiErrorText(err); }
    ui.asking = false; renderPanel(model);
  });
}

/* ════════════════════════════════════════════════════════════
   8. START
   ════════════════════════════════════════════════════════════ */
let model = null;

async function loadAnalysis() {
  ui.analysisState = ui.aiOn ? "loading" : "off";
  try {
    ui.analysis = await getAnalysis(model, ui.style);
    ui.analysisState = ui.analysis ? "ok" : "off";
  } catch (err) {
    console.warn("[Cockpit] Gemini:", err);
    ui.analysisState = "error";
    ui.analysisError = geminiErrorText(err);
  }
  renderPanel(model);
}

async function refresh() {
  try {
    model = buildModel(await loadMarket());
  } catch (err) {
    console.error("[Cockpit] Daten:", err);
    if (!model) model = buildModel({});
  }
  if (!model.raw.updated) ui.analysisState = "nodata";
  renderAll(model);
  if (model.raw.updated) loadAnalysis();
}

// Knopf "Aktualisieren": startet über den Worker die GitHub Action und wartet auf neue Daten
async function manualRefresh() {
  const btn = $("refreshBtn");
  if (btn.disabled) return;
  btn.disabled = true;
  btn.dataset.busy = "true";
  const before = model?.raw?.updated;
  try {
    if (CONFIG.refreshUrl) {
      $("liveInfo").textContent = "Daten werden geholt… (1–3 Min.)";
      const res = await fetch(CONFIG.refreshUrl, { method: "POST" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      // alle 15 s prüfen, ob neue Daten da sind (höchstens 5 Minuten)
      for (let i = 0; i < 20; i++) {
        await new Promise((r) => setTimeout(r, 15000));
        const m = await loadMarket().catch(() => null);
        if (m?.updated && m.updated !== before) break;
      }
    }
    await refresh();
  } catch (err) {
    console.warn("[Cockpit] Aktualisieren:", err);
    $("liveInfo").textContent = "Aktualisieren fehlgeschlagen";
  } finally {
    btn.disabled = false;
    btn.dataset.busy = "false";
  }
}

bindEvents();
renderAiSwitch();
refresh();
setInterval(refresh, CONFIG.refreshMinutes * 60000);
</script>
