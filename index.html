<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rohstoff Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }
        .card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .ampel {
            font-size: 20px;
        }
        .metric-row {
            display: flex;
            justify-content: space-between;
            margin: 15px 0;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .label {
            font-weight: bold;
        }
        .value {
            font-family: monospace;
            font-size: 16px;
        }
        .no-data {
            color: #d9534f;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <h3>Rohstoffe: Öl & Gold</h3>
            <div id="apiAmpel" class="ampel">🔴</div>
        </div>

        <div class="metric-row">
            <div>
                <span class="label">Gold-Öl-Ratio</span><br>
                <small>Info ▼</small>
            </div>
            <div id="valRatio" class="value no-data">–</div>
        </div>

        <div class="metric-row">
            <div>
                <span class="label">Goldpreis (Unze)</span><br>
                <small>Info ▼</small>
            </div>
            <div id="valGold" class="value no-data">⚠ Keine Live-Daten</div>
        </div>

        <div class="metric-row">
            <div>
                <span class="label">Ölpreis (WTI)</span><br>
                <small>Info ▼</small>
            </div>
            <div id="valOel" class="value no-data">⚠ Keine Live-Daten</div>
        </div>
    </div>

    <script>
        async function fetchRohstoffe() {
            const apiKeyNinja = 'Ns5Z1DsKWM0QVkXnsW0HnD92tGxmeguRWFOCM470';
            let goldPreis = null;
            let oelPreis = null;
            let allesGruen = true;

            // 1. Gold abrufen
            try {
                const goldRes = await fetch('https://api.api-ninjas.com/v1/goldprice', {
                    headers: { 'X-Api-Key': apiKeyNinja }
                });
                if (goldRes.ok) {
                    const goldData = await goldRes.json();
                    if (goldData && goldData.price) {
                        goldPreis = goldData.price;
                    } else {
                        allesGruen = false;
                    }
                } else {
                    allesGruen = false;
                }
            } catch (e) {
                console.error("Fehler beim Goldpreis:", e);
                allesGruen = false;
            }

            // 2. Öl abrufen (WTI)
            try {
                const oelRes = await fetch('https://api.api-ninjas.com/v1/oilprice?type=wti', {
                    headers: { 'X-Api-Key': apiKeyNinja }
                });
                if (oelRes.ok) {
                    const oelData = await oelRes.json();
                    if (oelData && oelData.price) {
                        oelPreis = oelData.price;
                    } else {
                        allesGruen = false;
                    }
                } else {
                    allesGruen = false;
                }
            } catch (e) {
                console.error("Fehler beim Ölpreis:", e);
                allesGruen = false;
            }

            // 3. UI aktualisieren
            const ampelEl = document.getElementById('apiAmpel');
            const goldEl = document.getElementById('valGold');
            const oelEl = document.getElementById('valOel');
            const ratioEl = document.getElementById('valRatio');

            if (goldPreis !== null) {
                goldEl.textContent = '$' + goldPreis.toFixed(2);
                goldEl.classList.remove('no-data');
            }

            if (oelPreis !== null) {
                oelEl.textContent = '$' + oelPreis.toFixed(2);
                oelEl.classList.remove('no-data');
            }

            if (goldPreis !== null && oelPreis !== null) {
                const ratio = goldPreis / oelPreis;
                ratioEl.textContent = ratio.toFixed(2);
                ratioEl.classList.remove('no-data');
            }

            if (allesGruen && goldPreis !== null && oelPreis !== null) {
                ampelEl.textContent = '🟢';
            } else {
                ampelEl.textContent = '🟡';
            }
        }

        // Funktion beim Laden der Seite ausführen
        fetchRohstoffe();
    </script>
</body>
</html>
